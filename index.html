<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Tells phone browsers in dark mode not to recolor the page: its colors are its own. -->
  <meta name="color-scheme" content="only light">
  <title>Ariadne Colina-Valeri | Electrical Engineering</title>
  <meta name="description" content="Portfolio of Ariadne Colina-Valeri, electrical engineering student at Tufts University.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="banner-wrap">
    <header class="site">
      <nav class="top">
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#experience">Experience</a>
        <a href="#contact">Contact</a>
        <a id="nav-resume" href="#" target="_blank" rel="noopener">Resume</a>
      </nav>
    </header>
  </div>

  <main>
    <div class="tab-panel" data-tab="about">
      <div class="hero flourish-field" data-flourish="big">
        <div class="hero-photo" id="hero-photo"></div>
        <span class="kicker" id="hero-kicker"></span>
        <span class="sparkle">✦ ✧ ✦</span>
        <h1 id="hero-name"></h1>
        <p id="hero-tagline"></p>
        <p class="hero-seeking" id="hero-seeking"></p>
        <p><a class="hero-email" id="hero-email" href="#"></a></p>
      </div>
      <section class="block">
        <div class="about">
          <div class="level reveal" id="about-text"></div>
          <aside class="level reveal">
            <h3>Education</h3>
            <p id="about-edu"></p>
            <h3>Languages</h3>
            <p id="about-lang"></p>
            <div id="skills"></div>
          </aside>
        </div>
      </section>
    </div>

    <section data-tab="projects" class="block tab-panel" hidden>
      <div class="section-head">
        <h2>Projects</h2>
      </div>
      <div class="card-grid" id="project-grid"></div>
    </section>

    <section data-tab="experience" class="block tab-panel" hidden>
      <div class="section-head">
        <h2>Experience</h2>
      </div>
      <div class="narrow" id="experience-list"></div>
    </section>

    <section data-tab="contact" class="block contact tab-panel" hidden>
      <div class="section-head">
        <h2>Contact</h2>
      </div>
      <p id="contact-note"></p>
      <div class="btn-row" id="contact-links"></div>
    </section>
  </main>

  <footer class="site" id="footer"></footer>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
