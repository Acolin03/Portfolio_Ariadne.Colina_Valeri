<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Tells phone browsers in dark mode not to recolor the page: its colors are its own. -->
  <meta name="color-scheme" content="only light">
  <title>Ariadne Colina-Valeri | Electrical Engineering</title>
  <meta name="description" content="Portfolio of Ariadne Colina-Valeri, electrical engineering student at Tufts University.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="banner-wrap">
    <header class="site">
      <nav class="top">
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#experience">Experience</a>
        <a href="#contact">Contact</a>
        <a class="nav-resume" id="nav-resume" href="#" target="_blank" rel="noopener">Resume</a>
      </nav>
    </header>
  </div>

  <main>
    <div class="tab-panel" data-tab="about">
      <section class="hero" id="hero">
        <div class="hero-photo" id="hero-photo"></div>
        <div class="hero-text">
          <p class="eyebrow" id="hero-kicker"></p>
          <h1 id="hero-name"></h1>
          <p class="lead" id="hero-tagline"></p>
          <p class="hero-seeking" id="hero-seeking"></p>
          <div class="btn-row">
            <a class="btn" id="hero-email" href="#">Contact Me</a>
            <a class="btn secondary" href="#projects">View Projects</a>
          </div>
        </div>
      </section>
      <section class="block about">
        <div class="panel reveal" id="about-text"></div>
        <div class="facts-row" id="about-facts"></div>
      </section>
    </div>

    <div class="tab-panel" data-tab="projects" hidden>
      <a class="corner-link" id="portfolio-link" href="#" target="_blank" rel="noopener">Download Portfolio (PDF)</a>
      <section class="block" id="progress-block">
        <div class="section-head">
          <h2>Current Projects</h2>
        </div>
        <div class="card-grid two" id="progress-grid"></div>
      </section>
      <section class="block">
        <div class="section-head">
          <h2>Selected Projects</h2>
        </div>
        <div class="filters" id="project-filters" role="group" aria-label="Filter projects by field"></div>
        <div class="card-grid" id="project-grid"></div>
      </section>
    </div>

    <section data-tab="experience" class="block tab-panel" hidden>
      <div class="section-head">
        <h2>Experience</h2>
      </div>
      <div id="experience-list"></div>
    </section>

    <section data-tab="contact" class="block tab-panel" hidden>
      <div class="section-head">
        <h2>Contact</h2>
        <p id="contact-note"></p>
      </div>
      <div class="contact-grid" id="contact-links"></div>
    </section>
  </main>

  <footer class="site" id="footer"></footer>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
